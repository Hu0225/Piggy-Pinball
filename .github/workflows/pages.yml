name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'test-physics.cjs'
      - 'test-rules.cjs'
      - 'test-feeder.cjs'
      - 'test-haptics.cjs'
      - 'test-audio.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify the game
        run: |
          node --check dist/app.js
          node --check dist/physics.js
          node --check dist/rules.js
          node --check dist/feeder.js
          node --check dist/haptics.js
          node --check dist/audio.js
          node test-physics.cjs
          node test-rules.cjs
          node test-feeder.cjs
          node test-haptics.cjs
          node test-audio.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
